# ── Optional: Umami (Reichweitenmessung) über diese Domain ─────────────────
# Siehe `location /u/` unten und den auskommentierten Tag in index.html. Wer
# kein Umami betreibt, lässt den Platzhalter stehen (ohne den Tag ruft
# niemand /u/ auf) oder entfernt die Blöcke `map … $umami_host`,
# `map … $umami_client_ip` und die drei `location … /u/…`.
#
# Den eigenen Umami-Host hier EINMAL eintragen (nur der Hostname, ohne https://).
map "" $umami_host {
    default "analytics.example.com";
}

# Umami liest die Besucher-IP zuerst aus X-Client-IP; X-Forwarded-For würde
# ein Reverse-Proxy vor dem Umami-Host durch die IP dieses Servers ersetzen.
# Erste Adresse aus X-Forwarded-For = Besucher — das stimmt nur, wenn der
# Proxy vor DIESEM nginx den Kopf selbst setzt und keinen vom Browser
# übernimmt (Traefik tut das).
map $http_x_forwarded_for $umami_client_ip {
    "~^(?<first>[^,\s]+)" $first;
    default                $remote_addr;
}

# ── Admin-Bereich auf eigener Adresse (Runde 8b, 10.10.2026, pdf-service/ADMIN.md)
#
# Diese Datei ist eine Vorlage: Beim Start des Containers ersetzt das
# nginx-Image ${ADMIN_HOST} durch die Umgebungsvariable gleichen Namens
# (Dockerfile: /etc/nginx/templates, NGINX_ENVSUBST_FILTER=^ADMIN_HOST$ — nur
# diese eine Variable, die $-Variablen von nginx bleiben unberührt). Ohne
# Angabe gilt „admin.invalid" (.invalid ist reserviert und löst nie auf):
# Dann gibt es keinen Admin-Host, und die Admin-Seite liegt wie bisher unter
# /admin/ auf derselben Adresse (Selbsthoster).
#
# Mit ADMIN_HOST liefert der Admin-Host NUR die Admin-Oberfläche (eigenes
# Einstiegs-HTML, eigenes Bündel, kein Editor, kein Umami) und reicht nur
# /pdfapi/api/admin/* weiter. Auf dem Haupthost gibt es dann weder /admin/
# noch /pdfapi/api/admin/* (404). Dieselbe Weiche steht in cv-api
# (admin.js), denn bei manchen Hostings (z. B. Coolify mit eigener API-App)
# routet der Proxy /pdfapi direkt an cv-api, an diesem nginx vorbei.
map "${ADMIN_HOST}" $cv_admin_separate {
    "admin.invalid" 0;
    ""              0;
    default         1;
}
map "$cv_admin_separate:$uri" $cv_admin_api_blocked {
    "~*^1:/pdfapi/api/admin(/|$)" 1;
    default                       0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keine Versionsnummer in `Server:` und auf Fehlerseiten.
    server_tokens off;

    # Docker-internal DNS resolver. Without this nginx hard-fails at startup
    # if `cv-api` isn't reachable in the network at config-parse time — which
    # happens if both apps are deployed concurrently. With a resolver + a
    # variable in the upstream hostname, lookups become runtime + lazy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Cache static assets
    #
    # Ein add_header hier ersetzt ALLE Kopfzeilen der Server-Ebene. Bis zum
    # 09.10.2026 fehlten den Assets deshalb nosniff und HSTS, und `expires 1y`
    # plus add_header ergaben zwei Cache-Control-Zeilen. Jetzt eine Angabe und
    # die Sicherheitsköpfe ausdrücklich.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Selbst gehostete Schriften für den PDF-/HTML-Export.
    #
    # Das exportierte HTML wird vom PDF-Dienst über setContent geladen und läuft
    # dort auf einem anderen Origin; ebenso ein heruntergeladenes HTML, das der
    # Nutzer per file:// öffnet. Schriftdateien brauchen in beiden Fällen CORS,
    # sonst fällt der Satz still auf eine Systemschrift zurück und das PDF sieht
    # anders aus als die Vorschau. Deshalb hier ausdrücklich ACAO — für Schriften
    # unkritisch, es sind statische, öffentliche Dateien.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location = /fonts.css {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # security.txt (RFC 9116) als Text, nie die SPA: fehlt die Datei, 404.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # OPTIONAL — Umami über die eigene Domain. Der Browser lädt /u/script.js
    # und sendet an /u/api/send (index.html: data-host-url="/u"); nginx reicht
    # beides an den Umami-Host aus `$umami_host` (map oben) weiter. So steht
    # kein fremder Host in script-src/connect-src, und ein Skript ohne SRI
    # kommt nicht direkt von dort. Cookies gehen in keine Richtung mit. Die
    # Besucher-IP bekommt Umami als X-Client-IP (map oben), sonst zählte es
    # alle Besuche als einen. Ohne Umami: Blöcke entfernen oder stehen lassen.
    location = /u/script.js {
        proxy_pass https://$umami_host/script.js;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $umami_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host $umami_host;
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Alt-Svc;
        proxy_read_timeout 10s;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location = /u/api/send {
        proxy_pass https://$umami_host/api/send;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $umami_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host $umami_host;
        proxy_set_header Cookie "";
        proxy_set_header X-Client-IP $umami_client_ip;
        proxy_set_header User-Agent $http_user_agent;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Alt-Svc;
        proxy_read_timeout 10s;
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location ^~ /u/ {
        return 404;
    }

    # Magazin: statische Seiten aus scripts/magazin-build.mjs (bis 10.10.2026
    # „Ratgeber" unter /ratgeber/; die alten Adressen leiten dauerhaft um).
    #
    # Eigener Block, damit /magazin/<slug>/ NIE auf die SPA zurückfällt: Ein
    # unbekannter Artikel bekommt eine echte 404 (sonst sähen Suchmaschinen
    # lauter „Soft-404" mit Status 200). `^~` hält die Regex-Regel für
    # .css/.woff2 oben fern; die Assets haben deshalb eigene Unterblöcke.
    # absolute_redirect off: Die Weiterleitung /magazin/x → /magazin/x/
    # bleibt relativ. Hinter einem Reverse-Proxy kennt nginx weder Schema noch
    # Port der öffentlichen Adresse und schickte sonst auf http://…:80/.
    #
    # CSP strenger als für die App: Die Seiten haben kein ausführbares
    # Skript (nur JSON-LD, das nie läuft), keine Inline-Stile und laden
    # nichts von fremden Hosts. Bilder dürfen aus /landing/ kommen (Aufruf am
    # Artikelende) – dieselbe Herkunft.
    location = /ratgeber {
        absolute_redirect off;
        return 301 /magazin/;
    }
    location ^~ /ratgeber/ {
        absolute_redirect off;
        rewrite ^/ratgeber/(.*)$ /magazin/$1 permanent;
    }

    location = /magazin {
        absolute_redirect off;
        return 301 /magazin/;
    }

    location ^~ /magazin/ {
        absolute_redirect off;
        try_files $uri $uri/ =404;
        error_page 404 /magazin/404.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # CSS und Schriften tragen einen Inhalts-Hash im Namen, Bilder ebenso
        # (Sync benennt sie nach ihrem SHA-256) — dürfen also ewig gecacht werden.
        location ^~ /magazin/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        }
        location ^~ /magazin/img/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        }
    }

    # Bildschirmfotos der Startseite (scripts/landing-shots.mjs). Die Seite
    # hängt die Version als ?v=<hash> an, ein neues Foto ist also eine neue
    # Adresse: lange zwischenspeichern ist sicher. Fehlende Dateien: 404, nie
    # die App.
    location ^~ /landing/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Vorgerenderte Seiten (scripts/landing-prerender.mjs): Startseite in vier
    # Sprachen und /preise. Kopfzeilen wie bei der App (gleiche CSP: Die
    # Seiten laden dasselbe Skript und übernehmen danach als App).
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
    location ~ ^/(en|fr|es)$ {
        absolute_redirect off;
        return 301 /$1/;
    }
    location ~ ^/(en|fr|es)/$ {
        try_files /$1/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
    location = /preise {
        try_files /preise/index.html /app.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
    location = /preise/ {
        absolute_redirect off;
        return 301 /preise;
    }

    # Admin-Oberfläche auf der Hauptadresse: nur ohne ADMIN_HOST
    # (Selbsthoster). Mit eigenem Admin-Host hier 404.
    # Die Admin-Hülle gibt es nur über /admin/ (Selbsthoster) bzw. den
    # Admin-Host, nie direkt als Datei (Audit 10.10.2026, S13). try_files im
    # Block /admin/ liefert sie intern aus und ist davon nicht betroffen.
    location = /admin.html {
        return 404;
    }
    location = /admin {
        if ($cv_admin_separate) {
            return 404;
        }
        absolute_redirect off;
        return 301 /admin/;
    }
    location ^~ /admin/ {
        if ($cv_admin_separate) {
            return 404;
        }
        try_files /admin.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # SPA fallback – always serve the app shell (app.html, written by
    # scripts/landing-prerender.mjs: the plain SPA shell, noindex). The
    # prerendered pages above have their own blocks; index.html is the German
    # landing page and must not be served for other paths.
    #
    # The app shell MUST NOT be cached: it references content-hashed JS/CSS
    # (cached 1y immutable above), so the browser has to re-fetch index.html on
    # every load to learn the new bundle hashes after a deploy. Without this the
    # browser rebuilds the *entire old app* from disk cache (stale shell + still-
    # cached immutable assets) and never sees a new version until a hard reload.
    #
    # NOTE: an add_header inside a location REPLACES the server-level ones for
    # responses served here, so the security headers are repeated below to keep
    # applying to index.html. (Hashed assets have their own location and already
    # override these — unchanged.)
    location / {
        try_files $uri /app.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # API/PDF backend behind the same origin. Variable im upstream-Hostnamen
    # erzwingt lazy/runtime-Resolution via resolver (siehe oben). `rewrite`
    # stripped den /pdfapi-Präfix manuell — der trailing-slash-Trick funktioniert
    # mit Variablen-Upstream leider nicht.
    location /pdfapi/ {
        # Admin-API nur auf dem Admin-Host (siehe map oben). Groß- und
        # Kleinschreibung egal: Express unterscheidet sie bei Routen nicht.
        if ($cv_admin_api_blocked) {
            return 404;
        }
        # set VOR rewrite. Beides sind Direktiven des Rewrite-Moduls, und
        # `break` beendet diese Phase — was darunter steht, läuft dann nicht
        # mehr. Bei einem direkten Aufruf fiel das nie auf; kommt die Anfrage
        # aber über eine interne Umleitung (`last`) aus einem anderen Block
        # hier an, quittiert nginx es mit „using uninitialized variable" und
        # 500. Erst setzen, dann umschreiben — dann stimmt beides.
        set $cv_api_upstream "cv-api:3000";
        rewrite ^/pdfapi/(.*)$ /$1 break;
        proxy_pass http://$cv_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 16m;
    }

    location = /pdfapi {
        return 308 /pdfapi/;
    }

    # OAuth-Discovery für den MCP-Endpunkt.
    #
    # Diese beiden Pfade MÜSSEN vor der SPA-Fallback-Regel stehen. Sonst
    # beantwortet `location /` sie mit index.html — Status 200, Content-Type
    # text/html — und der Client, der JSON erwartet, meldet „Registrierung beim
    # Anmeldedienst fehlgeschlagen", obwohl alles läuft.
    #
    # Beantwortet werden sie vom MCP-Container, nicht von cv-api. Grund: cv-api
    # hängt in dieser Installation NICHT hinter diesem nginx, sondern wird vom
    # Coolify-Proxy direkt unter /pdfapi geroutet — von hier aus ist der Name
    # „cv-api" gar nicht auflösbar. Das kostete zwei Fehlversuche (502,
    # „cv-api could not be resolved"), während /pdfapi im Browser
    # anstandslos funktionierte: diese Anfragen kommen hier nie an.
    # Die Metadaten sind reine Wegweiser; die eigentlichen Endpunkte liegen in
    # cv-api und werden über ihre öffentliche Adresse benannt.
    location /.well-known/oauth-protected-resource {
        set $cv_mcp_wk_pr "cv-mcp:3000";
        proxy_pass http://$cv_mcp_wk_pr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /.well-known/oauth-authorization-server {
        set $cv_mcp_wk_as "cv-mcp:3000";
        proxy_pass http://$cv_mcp_wk_as;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Kurze Adressen für den Anmeldedienst: /oauth/authorize statt
    # /pdfapi/api/oauth/authorize. Der Mensch sieht diese Adresse, während er
    # die Zustimmung erteilt.
    #
    # Funktioniert, wenn DIESER nginx die cv-api erreicht — im mitgelieferten
    # docker-compose ist das so, und ein leeres OAUTH_PUBLIC_BASE verlässt sich
    # darauf. Hängt die cv-api dagegen mit eigenem Pfad-Routing am
    # Reverse-Proxy davor (Coolify, Traefik), kommen Anfragen hier gar nicht an
    # bzw. enden in 502; dann OAUTH_PUBLIC_BASE und MCP_AUTH_BASE auf
    # <Adresse>/pdfapi/api/oauth setzen und diesen Block durch
    # `location ^~ /oauth/ { return 404; }` ersetzen.
    location /oauth/ {
        # set VOR rewrite: beides sind Direktiven des Rewrite-Moduls, und
        # `break` beendet die Phase — was darunter steht, liefe nicht mehr.
        set $cv_api_oauth "cv-api:3000";
        rewrite ^/oauth/(.*)$ /api/oauth/$1 break;
        proxy_pass http://$cv_api_oauth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    # Gehosteter MCP-Server (eigene App im selben coolify-Netz, Alias cv-mcp).
    # Reverse-Proxy unter /mcp, damit der Endpunkt HTTPS + Zertifikat der
    # Hauptdomain nutzt. Streamable-HTTP: Buffering aus, Authorization-Header
    # durchreichen (Standard bei proxy_pass), keep-alive offen halten.
    location /mcp {
        # Falls das Token als ?k=… mitkommt (Client ohne Header): nicht loggen.
        access_log off;
        set $cv_mcp_upstream "cv-mcp:3000";
        proxy_pass http://$cv_mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 4m;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS: lock the browser to HTTPS for two years. Add `preload` only after
    # registering at hstspreload.org — until then keep it without.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Permissions-Policy: deny features we never use. Reduces fingerprint
    # surface and stops third-party iframes (none currently) from probing.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Content-Security-Policy: pinned for the SPA + same-origin Schriften +
    # photos. Optionales Umami läuft über /u/ auf derselben Domain (siehe
    # oben), ein fremder Analytics-Host gehört deshalb nicht in
    # script-src/connect-src.
    # 'unsafe-inline' on style-src is required because the React renderer
    # emits inline styles literally everywhere; long-term we should nonce/hash
    # them, but that's a bigger refactor. data: on img-src covers the photo
    # upload preview, blob: locally generated images. No https: any more: the
    # app loads no foreign images (photos and share-link photos come from /pdfapi).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

# ── Admin-Host ────────────────────────────────────────────────────────────
# Nur die Admin-Oberfläche. Steht NACH dem Hauptserver, damit der Hauptserver
# der Standard für unbekannte Hosts bleibt (Healthchecks fragen oft mit
# Host localhost). Mit ADMIN_HOST=admin.invalid antwortet dieser Block nie.
server {
    listen 80;
    server_name "${ADMIN_HOST}";
    root /usr/share/nginx/html;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # Einstieg: dist/admin.html (Vite, eigenes Bündel). Strenge CSP: kein
    # Inline-Skript, keine Inline-Stile im HTML (React setzt Stile über das
    # CSSOM, das deckt style-src nicht ab), nichts von fremden Hosts.
    location = / {
        try_files /admin.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # Gebündelte Dateien (Hash im Namen). Fehlt eine: 404, nie HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location = /favicon.svg {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 'User-agent: *
Disallow: /
';
    }

    # Admin-API. Routet ein Proxy /pdfapi direkt an cv-api, kommt es gar nicht
    # hier an; im mitgelieferten docker-compose.yml (dieser nginx vor cv-api)
    # gilt diese Weiterleitung — und nur sie. Groß geschriebene
    # Varianten fallen in den 404-Block darunter.
    location ^~ /pdfapi/api/admin/ {
        set $cv_api_upstream "cv-api:3000";
        rewrite ^/pdfapi/(.*)$ /$1 break;
        proxy_pass http://$cv_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # Alles andere gibt es auf diesem Host nicht.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        return 404;
    }
}
