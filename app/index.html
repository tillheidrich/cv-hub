<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover handles iPhone notch; minimum-scale + maximum-scale prevent
         double-tap zoom *and* the iOS-Safari auto-zoom-on-input behaviour that made
         the editor feel "stuck" on phones. We compensate by ensuring input font-size
         is ≥16px on mobile (see :root style below). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4F1" />
    <style>
      /* Mobile-only: bump input/textarea/select font-size to 16px so iOS Safari
         doesn't auto-zoom in when the field gains focus. The desktop sizes
         (13.5px) stay intact above 720px where the auto-zoom isn't an issue. */
      @media (max-width: 720px) {
        input, textarea, select {
          font-size: 16px !important;
        }
      }
      /* Honor the iPhone safe-area at the bottom (gesture bar) so the mobile
         tab bar isn't covered by the home-indicator strip. */
      html, body { overscroll-behavior-y: none; }

      /* A11y: keyboard users need to see where focus lives. App-wide inline
         styles set outline:none everywhere, so this rule is the single source
         of truth — only kicks in for keyboard focus (focus-visible), not the
         pointer click ripple. Brown matches the editorial accent. */
      :focus-visible {
        outline: 2px solid oklch(0.55 0.216 264) !important;
        outline-offset: 2px !important;
        border-radius: 3px;
      }

      /* A11y: respect users who asked the OS to reduce motion. Kills every
         transition + animation across the SPA — necessary because we use a
         lot of inline `transition: …` declarations that bypass any opt-out
         CSS the renderer might set. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }

      /* Mobile-Modal-Fullscreen: unter 640px werden zentrierte 680px-Modals
         (AdminPanel, KeysPanel, VersionsPanel, SoftWall) zu Vollbild-Sheets.
         Spart ~48px horizontal-padding und verhindert dass Action-Buttons
         (z.B. "Konto endgültig löschen") rechts rausrutschen. */
      @media (max-width: 640px) {
        [data-modal="true"] {
          inset: 0 !important;
          max-width: 100vw !important;
          max-height: 100dvh !important;
          width: 100vw !important;
          height: 100dvh !important;
          border-radius: 0 !important;
          padding: 16px !important;
        }
        [data-modal-backdrop="true"] {
          padding: 0 !important;
        }
        [data-modal-actions="true"] {
          flex-wrap: wrap !important;
          gap: 8px !important;
        }
      }

      /* Click-on-preview affordance: when the preview wrapper is clickable,
         the nearest <section> the cursor is hovering inside gets a faint
         editorial outline + bg tint so the user knows the area will jump
         them to the editor. Falls back to no effect on touch devices. */
      @media (hover: hover) {
        .cv-clickable section { transition: background-color 120ms, box-shadow 120ms; }
        .cv-clickable section:hover {
          background-color: rgba(139, 115, 85, 0.04);
          box-shadow: inset 0 0 0 1px rgba(139, 115, 85, 0.22);
        }
      }
    </style>
    <!--cv:head:start-->
    <!-- Seitenkopf der App-Hülle. Beim Bau ersetzt scripts/landing-prerender.mjs
         alles zwischen cv:head:start und cv:head:end: für /, /en/, /fr/, /es/
         und /preise durch Titel, Beschreibung, Canonical, hreflang,
         Vorschaubild und strukturierte Daten der jeweiligen Seite, für die
         übrigen Pfade (app.html) durch diesen allgemeinen Kopf. -->
    <title>CV-Hub · Lebenslauf und Anschreiben</title>
    <meta name="description" content="Lebenslauf und Anschreiben im Browser schreiben: PDF mit echter Textebene, ATS-Fassung als PDF oder Word, vier Sprachen, ohne Konto." />
    <!--cv:head:end-->
    <!-- Schriften werden selbst ausgeliefert (src/fonts.ts, @fontsource),
         nicht vom Google-Fonts-CDN: keine Aufrufe an fremde Server. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics bewusst nicht eingeschaltet. Optional: Umami (cookie-frei)
         über diese Domain ausliefern, damit der Browser mit keinem fremden
         Host spricht und die CSP keinen braucht. Dazu in nginx.conf
         $umami_host auf den eigenen Umami-Host setzen (Platzhalter
         analytics.example.com, location /u/) und die beiden Tags unten mit
         der eigenen Website-ID einkommentieren. umami-filter-v1.js entfernt
         Token aus den gemeldeten Adressen (/share/…, /reset/…),
         bevor Umami sie sendet. Wer kein Analytics will, lässt beides so;
         die /u/-Blöcke in nginx.conf können dann auch entfallen.
    <script defer src="/umami-filter-v1.js"></script>
    <script defer src="/u/script.js" data-host-url="/u" data-do-not-track="true" data-exclude-search="true" data-exclude-hash="true" data-before-send="cvUmamiBeforeSend" data-website-id="YOUR-UMAMI-WEBSITE-ID"></script>
    -->
  </body>
</html>
