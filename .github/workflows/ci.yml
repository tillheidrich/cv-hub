# Was hier läuft, läuft ohne Browser und ohne Datenbank.
#
# Von den dreizehn Prüfskripten unter app/scripts/ braucht genau eines keinen
# Chromium (build-fonts, und das hängt ohnehin am Build). Alles andere — Kontrast,
# Überlauf, Seitenzahl, PDF-Textebene, Word-Export — setzt einen laufenden
# Dev-Server und einen echten Browser voraus und gehört deshalb (noch) nicht
# hierher. Lieber eine CI, die drei Dinge ehrlich prüft, als eine, die zehn
# behauptet und übersprungen meldet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Typen
        run: npx tsc -b
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          for f in pdf-service/*.js mcp/*.mjs; do node --check "$f"; done
      - name: Tests (SSRF-Schutz und OAuth)
        run: node --test
        working-directory: pdf-service

  keine-personendaten:
    # Dieses Projekt ist aus einem privaten Werkzeug herausgelöst worden. Die
    # Entpersonalisierung war Handarbeit, und Handarbeit hält nicht von selbst.
    # Der Wächter kostet zehn Sekunden und schlägt an, bevor etwas gepusht ist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Muster suchen, die hier nichts verloren haben
        run: |
          # Zwei Klassen, weil sie unterschiedlich streng sind.
          #
          # HART: darf nirgends stehen, ohne Ausnahme — Anschrift, Telefonnummer,
          # private Mailadresse, Zugangsdaten jeder Art.
          HART='Rotdornweg|21255 Tostedt|73953819|tillheidrich\.de|ghp_[A-Za-z0-9]{20,}|github_pat_|xox[baprs]-|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY'
          #
          # WEICH: die Domain des Autors. Sie darf an GENAU EINER Stelle stehen —
          # als Adresse der Demo-Instanz in der README. Überall sonst ist sie ein
          # Rückfall in die Zeit vor der Entpersonalisierung: eine fest verdrahtete
          # Domain, ein Analytics-Host, ein Standardwert, der die Daten fremder
          # Betreiber zum Autor schickt. Genau das soll hier auffallen.
          WEICH='heidrich-digital'
          ERLAUBT='https://cv\.heidrich-digital\.de'
          AUS=(-- . ':!package-lock.json' ':!**/package-lock.json' ':!.github/workflows/ci.yml')

          FEHLER=0
          if git grep -nIE "$HART" "${AUS[@]}"; then
            echo "::error::Personenbezogene Daten oder Zugangsdaten gefunden."
            FEHLER=1
          fi
          # Treffer der weichen Klasse, bei denen die erlaubte Demo-Adresse NICHT
          # die Erklärung ist.
          REST=$(git grep -nIE "$WEICH" "${AUS[@]}" | grep -vE "$ERLAUBT" || true)
          if [ -n "$REST" ]; then
            echo "$REST"
            echo "::error::Domain des Autors außerhalb des Demo-Links in der README."
            FEHLER=1
          fi
          [ "$FEHLER" -eq 0 ] && echo "sauber"
          exit $FEHLER
