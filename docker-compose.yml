# CV-Hub — one-command self-host stack: Postgres + backend (cv-api) + MCP + frontend (nginx).
# Quickstart:  cp .env.example .env  &&  edit .env  &&  docker compose up -d
# Then open http://localhost:8080 — the first account you register becomes admin
# (or set ADMIN_USERNAME/ADMIN_PASSWORD in .env for a bootstrapped admin).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvhub}
      POSTGRES_DB: ${POSTGRES_DB:-cvhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Service name MUST be cv-api — the frontend nginx proxies /pdfapi -> cv-api:3000.
  cv-api:
    build: ./pdf-service
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cvhub}:${POSTGRES_PASSWORD:-cvhub}@postgres:5432/${POSTGRES_DB:-cvhub}
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-1}
      JWT_SECRET: ${JWT_SECRET}
      APP_NAME: ${APP_NAME:-CV-Hub}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Optional separate admin area on its own host (pdf-service/ADMIN.md).
      # Empty = admin page under /admin/ on the main address. Set the same
      # ADMIN_HOST for the frontend below.
      ADMIN_HOST: ${ADMIN_HOST:-}
      ADMIN_URL: ${ADMIN_URL:-}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Public address of the OAuth endpoints. Empty is correct for this stack
      # (nginx routes /oauth here); set it when a proxy strips a path prefix,
      # because then this service cannot know its own public address.
      OAUTH_PUBLIC_BASE: ${OAUTH_PUBLIC_BASE:-}
      # Optional paid mode (application pass via Mollie). OFF unless
      # BILLING_ENABLED=1 and every seller value is set — see .env.example.
      BILLING_ENABLED: ${BILLING_ENABLED:-0}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      PASS_PRICE_CENTS: ${PASS_PRICE_CENTS:-900}
      PASS_DAYS: ${PASS_DAYS:-90}
      PRODUCT_NAME: ${PRODUCT_NAME:-CV-Hub}
      INVOICE_PREFIX: ${INVOICE_PREFIX:-CV}
      SELLER_NAME: ${SELLER_NAME:-}
      SELLER_ADDRESS: ${SELLER_ADDRESS:-}
      SELLER_EMAIL: ${SELLER_EMAIL:-}
      SELLER_PHONE: ${SELLER_PHONE:-}
      SELLER_TAX_ID: ${SELLER_TAX_ID:-}
      TERMS_VERSION: ${TERMS_VERSION:-}
      # BILLING_NOTIFY_EMAIL: ${BILLING_NOTIFY_EMAIL:-}
      # PAYMENT_METHODS: ${PAYMENT_METHODS:-}
      # Optional open registration (double opt-in) and self-hosted ALTCHA
      # bot protection. ALTCHA_HMAC_KEY is required for both open
      # registration and purchases.
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-0}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Service name MUST be cv-mcp — the frontend nginx proxies /mcp -> cv-mcp:3000.
  #
  # Optional: only needed if you want AI clients (Claude and friends) to connect
  # over MCP. It is multi-tenant — every user of your instance authorizes their
  # own client and sees only their own data.
  #
  # Note there is no CV_API_KEY here, and there must not be: in hosted mode the
  # caller brings their own token. A key from the environment would turn every
  # caller into the same account.
  cv-mcp:
    build: ./mcp
    environment:
      MCP_HTTP: "1"
      CV_API_BASE: http://cv-api:3000
      MCP_PUBLIC_URL: ${APP_BASE_URL:-http://localhost:8080}
      # Only needed when the backend sits behind a path prefix your proxy
      # strips. In this stack it does not, so the default is right.
      MCP_AUTH_BASE: ${MCP_AUTH_BASE:-}
    depends_on:
      - cv-api
    restart: unless-stopped

  frontend:
    build:
      context: ./app
      args:
        # Base for canonical, hreflang, og:url, sitemap and llms.txt of the
        # prerendered start page and the magazine under /magazin/
        # (scripts/landing-prerender.mjs, scripts/magazin-build.mjs).
        PUBLIC_BASE_URL: ${APP_BASE_URL:-}
    environment:
      # app/nginx.conf is a template: the nginx image substitutes only the
      # ADMIN_HOST placeholder at start-up (/etc/nginx/templates,
      # NGINX_ENVSUBST_FILTER=^ADMIN_HOST$ in app/Dockerfile). admin.invalid
      # never resolves, so without ADMIN_HOST there is no admin host.
      ADMIN_HOST: ${ADMIN_HOST:-admin.invalid}
    ports:
      - "8080:80"
    depends_on:
      - cv-api
      - cv-mcp
    restart: unless-stopped

volumes:
  pgdata:
